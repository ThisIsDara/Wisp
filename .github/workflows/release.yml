name: release

# Builds the release, assembles the NSIS installer, submits the artifacts to
# SignPath Foundation for code signing (see CODE_SIGNING_POLICY.md), and
# publishes a GitHub Release with SHA256SUMS. Trigger by pushing a v* tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Qt 6.11.1 MSVC x64. aqtinstall 3.3.0 (what install-qt-action@v4
      # ships) cannot parse Qt's new Windows repo layout for 6.11+, fixed
      # in git master only (miurahr/aqtinstall#959, PR #1000) — install from
      # git and call aqt directly, on a pinned stable Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install Qt 6.11.1
        shell: pwsh
        run: |
          python -m pip install --quiet git+https://github.com/miurahr/aqtinstall.git
          python -m aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 --outputdir D:\a\Wisp\Qt
          "Qt6_DIR=D:\a\Wisp\Qt\6.11.1\msvc2022_64" >> $env:GITHUB_ENV
          "D:\a\Wisp\Qt\6.11.1\msvc2022_64\bin" >> $env:GITHUB_PATH

      # vcvars64 environment for CMake/Ninja
      - uses: ilammy/msvc-dev-cmd@v1

      # NSIS portable into build/tools/NSIS (build-installer.ps1's fallback
      # location). choco's nsis package doesn't shim makensis onto PATH, and
      # NSIS publishes only on SourceForge (no GitHub releases) — pinned 3.12.
      - name: install NSIS (portable)
        shell: pwsh
        run: |
          $dir = "build\tools\NSIS"
          if (-not (Test-Path "$dir\makensis.exe")) {
            New-Item -ItemType Directory -Force -Path "build\tools" | Out-Null
            Invoke-WebRequest "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip" -OutFile "build\tools\nsis.zip"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            tar -xf "build\tools\nsis.zip" -C "build\tools"
            Copy-Item "build\tools\nsis-3.12\*" $dir -Recurse -Force
          }
          & "$dir\makensis.exe" /VERSION

      - name: build + deploy + installer
        shell: pwsh
        run: ./packaging/build-installer.ps1 -Config release

      # SignPath signs a single zip artifact; wisp.exe is embedded inside
      # wisp-setup.exe, so the artifact config (.signpath/) signs both.
      - name: package unsigned artifacts
        shell: pwsh
        run: |
          $d = "build\deploy"
          Compress-Archive -Path "$d\wisp\wisp.exe", "$d\wisp-setup.exe" -DestinationPath "$d\unsigned.zip" -Force

      - name: upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          path: build/deploy/unsigned.zip

      - name: submit signing request
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed

      - name: assemble release assets
        shell: pwsh
        run: |
          $assets = "build\release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          if (Test-Path "build\signed") {
            $z = Get-ChildItem "build\signed" -Filter *.zip | Select-Object -First 1
            if ($z) { Expand-Archive -Path $z.FullName -DestinationPath $assets -Force }
          }
          if (-not (Test-Path "$assets\wisp.exe")) { Copy-Item "build\deploy\wisp\wisp.exe" $assets }
          if (-not (Test-Path "$assets\wisp-setup.exe")) { Copy-Item "build\deploy\wisp-setup.exe" $assets }
          Get-ChildItem $assets -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$h  $($_.Name)" | Out-File "$assets\SHA256SUMS" -Append -Encoding ascii
          }
          Get-ChildItem $assets

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $assets = "build\release-assets\wisp.exe", "build\release-assets\wisp-setup.exe", "build\release-assets\SHA256SUMS"
          $notes = "RELEASES\$($env:GITHUB_REF_NAME).md"
          if (Test-Path $notes) {
            gh release create "$env:GITHUB_REF_NAME" @assets --notes-file $notes
          } else {
            gh release create "$env:GITHUB_REF_NAME" @assets --generate-notes
          }
